name: Build and deploy online dashboard

on:
  push:
    branches: [main]
  schedule:
    # 每天 22:00 UTC / 北京时间 06:00 更新一次数据
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install requests

      - name: Build static site
        env:
          SITE_PASSPHRASE: ${{ secrets.SITE_PASSPHRASE }}
          LIXINGER_COOKIES: ${{ secrets.LIXINGER_COOKIES }}
        run: |
          python tools/build_static.py --api --out _site --fallback docs/data.enc.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
